# Builds the desktop installers on every push to main; on `v*` tags it also attaches
# them to a draft GitHub Release, which is published by hand after a check.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            bundles: app,dmg
            artifacts: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: windows-x64
            bundles: nsis
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      # After the build, because tauri-build needs the sidecars it downloads.
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib
      - uses: actions/upload-artifact@v4
        with:
          name: vana-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
